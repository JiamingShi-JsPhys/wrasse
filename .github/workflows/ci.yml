name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[java]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke — the CLI runs and finds the planted issues
        run: wrasse audit examples/playground --offline --no-color --no-state
        continue-on-error: true
      - name: Exit code contract
        shell: bash
        run: |
          set +e
          wrasse audit examples/playground --offline --no-color --no-state
          code=$?
          echo "exit=$code"
          test "$code" = "2"
      - name: Clean project exits 0
        shell: bash
        run: |
          set +e
          wrasse audit tests/corpus/secure --offline --no-color --no-state > /dev/null
          code=$?
          echo "exit=$code"
          test "$code" = "0"
